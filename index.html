<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom Activity & Token Hub</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 3rem; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }

    .header-banner {
      width: 100%; height: 220px; background-size: cover; background-position: center;
      position: relative; background-color: #6366f1; margin-bottom: 2rem;
      display: flex; align-items: flex-end; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .banner-overlay {
      width: 100%; padding: 1.5rem 0; background: linear-gradient(transparent, rgba(15,23,42,0.85));
      color: white;
    }
    .banner-content {
      display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 1rem;
    }

    .mode-badge {
      padding: 0.4rem 0.8rem; border-radius: 20px; font-size: 0.85rem; font-weight: bold;
      display: inline-flex; align-items: center; gap: 0.4rem;
    }
    .mode-teacher { background: #e0e7ff; color: #3730a3; }
    .mode-student { background: #dcfce7; color: #166534; }

    .btn {
      padding: 0.6rem 1rem; background: var(--primary); color: white; border: none;
      border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: #cbd5e1; color: #334155; }
    .btn-secondary:hover { background: #94a3b8; }

    .banner-edit-btn {
      position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.6); color: white;
      border: none; padding: 0.5rem 0.8rem; border-radius: 8px; font-size: 0.8rem; cursor: pointer; display: none;
    }
    body.teacher-mode .banner-edit-btn { display: block; }

    .grid-container {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem;
    }

    .section-card {
      background: var(--card); border-radius: 16px; border: 1px solid var(--border);
      overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; position: relative;
    }
    .section-card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }

    .card-cover {
      height: 130px; background-size: cover; background-position: center;
      position: relative; background-color: #cbd5e1;
    }

    .card-body { padding: 1.25rem; }
    .card-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 0.4rem; }
    .card-meta { font-size: 0.85rem; color: var(--muted); }

    .card-actions {
      position: absolute; top: 10px; right: 10px; display: none; gap: 0.3rem; flex-wrap: wrap;
    }
    body.teacher-mode .card-actions { display: flex; }
    .action-badge-btn {
      background: rgba(0,0,0,0.7); color: white; border: none; padding: 0.3rem 0.5rem;
      border-radius: 6px; font-size: 0.75rem; cursor: pointer;
    }

    .teacher-panel {
      background: var(--card); padding: 1.25rem; border-radius: 12px;
      border: 1px solid var(--border); margin-bottom: 1.5rem; display: none;
    }
    body.teacher-mode .teacher-panel { display: block; }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.75rem; align-items: center; }
    input, select { padding: 0.6rem 0.8rem; border: 1px solid var(--border); border-radius: 8px; outline: none; }

    .file-input-wrapper { position: relative; display: inline-block; width: 100%; }
    .file-input-label {
      display: block; padding: 0.6rem 0.8rem; background: #f1f5f9; border: 1px dashed var(--border);
      border-radius: 8px; text-align: center; cursor: pointer; font-size: 0.85rem; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .file-input-wrapper input[type="file"] {
      position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer;
    }

    /* TERM TABS STYLING */
    .term-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .term-tab {
      padding: 0.5rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.2s;
    }
    .term-tab.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* TABLE WRAPPER WITH MAX HEIGHT FOR STICKY SCROLLING */
    .table-wrapper { 
      overflow: auto; 
      max-height: 75vh;
      background: var(--card); 
      border-radius: 12px; 
      border: 1px solid var(--border); 
    }
    table { width: 100%; border-collapse: separate; border-spacing: 0; }
    th, td { padding: 0.5rem 0.4rem; border-bottom: 1px solid var(--border); text-align: center; vertical-align: middle; }

    /* FREEZE TOP HEADER ROW */
    th { 
      background: #f1f5f9; 
      font-size: 0.75rem; 
      color: var(--muted); 
      text-transform: uppercase;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    /* FREEZE & COMPACT FIRST COLUMN (STUDENTS) */
    th:first-child, td:first-child {
      position: sticky;
      left: 0;
      z-index: 2;
      background: var(--card);
      border-right: 2px solid var(--border);
      box-shadow: 2px 0 5px rgba(0,0,0,0.05);
      width: 140px !important;
      min-width: 140px !important;
      max-width: 140px !important;
    }

    /* TOP-LEFT CORNER CELL OVERLAP FIX */
    th:first-child {
      background: #f1f5f9;
      z-index: 11;
    }

    /* COMPACT ACTIVITY COLUMNS FOR MOBILE FITTING */
    th:not(:first-child), td:not(:first-child) {
      min-width: 65px;
      max-width: 80px;
    }

    .student-info { display: flex; align-items: center; gap: 0.35rem; text-align: left; }
    .student-name { 
      cursor: default; 
      font-size: 0.78rem; 
      line-height: 1.1; 
      word-break: break-word; 
    }
    body.teacher-mode .student-name { cursor: pointer; text-decoration: underline dotted var(--primary); }
    .avatar { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); object-fit: cover; flex-shrink: 0; }
    body.teacher-mode .avatar { cursor: pointer; border: 2px dashed var(--primary); }

    .act-header-wrapper { display: block; color: inherit; text-decoration: none; padding: 0.1rem; border-radius: 6px; transition: background 0.15s; }
    .act-header-wrapper.has-link { cursor: pointer; }
    .act-header-wrapper.has-link:hover { background: #e2e8f0; }
    .act-title-text { 
      font-size: 0.7rem; 
      color: var(--text); 
      font-weight: bold; 
      text-transform: none; 
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .act-header-wrapper.has-link .act-title-text { color: var(--primary); }

    .token-btn {
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.2s, filter 0.2s;
      opacity: 1 !important;
      filter: none !important;
      color: initial !important;
      -webkit-text-fill-color: initial !important;
    }
    .token-btn:hover { transform: scale(1.2); }
    .token-btn.empty {
      opacity: 0.18 !important;
      filter: grayscale(100%) !important;
    }
    .token-btn:disabled {
      cursor: default;
      opacity: 1 !important;
      filter: none !important;
      color: initial !important;
      -webkit-text-fill-color: initial !important;
    }
    .token-btn.empty:disabled {
      opacity: 0.18 !important;
      filter: grayscale(100%) !important;
    }

    .icon-btn-sm { background: none; border: none; cursor: pointer; font-size: 0.7rem; opacity: 0.7; margin: 0 1px; }
    .icon-btn-sm:hover { opacity: 1; }
    .nav-breadcrumb { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; }
  </style>
</head>
<body>

  <input type="file" id="global-banner-picker" accept="image/*" style="display:none;" onchange="handleBannerFileSelect(event)" />
  <input type="file" id="global-cover-picker" accept="image/*" style="display:none;" onchange="handleCoverFileSelect(event)" />
  <input type="file" id="global-avatar-picker" accept="image/*" style="display:none;" onchange="handleAvatarFileSelect(event)" />

  <div class="header-banner" id="main-banner" style="background-image: url('https://images.unsplash.com/photo-1513542789411-b6a5d4f31634?w=1200&auto=format&fit=crop&q=60');">
    <button class="banner-edit-btn" onclick="document.getElementById('global-banner-picker').click()">📷 Change Header Banner</button>
    <div class="banner-overlay">
      <div class="container banner-content">
        <div>
          <h1 id="banner-heading-text" style="font-size: 2rem;">🎓 Classroom Activity Hub</h1>
          <p style="opacity: 0.9; font-size: 0.95rem;">Track progress, complete performance tasks, and earn reward tokens!</p>
        </div>
        <div>
          <span id="mode-indicator" class="mode-badge mode-student">👀 Student View</span>
          <button class="btn" id="toggle-mode-btn" onclick="toggleMode()" style="margin-left:0.5rem;">🔑 Teacher Login</button>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="nav-breadcrumb" id="breadcrumb" style="display: none;">
      <button class="btn btn-secondary" onclick="showHome()">← Back to Sections</button>
      <h2 id="active-section-title" style="font-size: 1.3rem;"></h2>
    </div>

    <div class="teacher-panel">
      <h3 style="margin-bottom: 0.75rem;">✏️ Teacher Controls</h3>
      
      <div class="form-grid" id="form-add-section" style="margin-bottom: 1rem;">
        <input type="text" id="new-section-name" placeholder="New Section Name" />
        <div class="file-input-wrapper">
          <span class="file-input-label" id="section-cover-label">📷 Upload Cover</span>
          <input type="file" id="new-section-cover-file" accept="image/*" onchange="updateLabel(this, 'section-cover-label')" />
        </div>
        <button class="btn" onclick="addSection()">+ Add Section</button>
      </div>

      <div class="form-grid" id="form-section-controls" style="display: none;">
        <input type="text" id="new-student-name" placeholder="Student Name" />
        <div class="file-input-wrapper">
          <span class="file-input-label" id="student-avatar-label">👤 Upload Photo</span>
          <input type="file" id="new-student-avatar-file" accept="image/*" onchange="updateLabel(this, 'student-avatar-label')" />
        </div>
        <button class="btn" onclick="addStudent()">+ Add Student</button>
        
        <div style="grid-column: 1 / -1; height: 1px; background: var(--border); margin: 0.25rem 0;"></div>
        
        <input type="text" id="new-act-title" placeholder="Task Title" />
        <input type="date" id="new-act-date" title="Activity Date" />
        <input type="url" id="new-act-link" placeholder="Attachment/Drive Link (Optional)" />
        <select id="new-act-token">
          <option value="⭐">⭐ Star</option>
          <option value="🏆">🏆 Trophy</option>
          <option value="🎨">🎨 Palette</option>
          <option value="🏅">🏅 Medal</option>
          <option value="🚀">🚀 Rocket</option>
        </select>
        <button class="btn" onclick="assignActivity()">+ Assign Activity</button>
      </div>
    </div>

    <div id="home-view">
      <h3 style="margin-bottom: 1rem; color: var(--muted);">Select Your Grade Level / Section</h3>
      <div class="grid-container" id="sections-grid"></div>
    </div>

    <div id="section-view" style="display: none;">
      <!-- Term Switching Bar -->
      <div class="term-tabs">
        <button class="term-tab active" id="term-1-btn" onclick="switchTerm(1)">Term 1</button>
        <button class="term-tab" id="term-2-btn" onclick="switchTerm(2)">Term 2</button>
        <button class="term-tab" id="term-3-btn" onclick="switchTerm(3)">Term 3</button>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr id="table-header">
              <th>Student</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAABIEep2GsKERmOWUktIzT1_AEnv2MEZo",
      authDomain: "math-tracker-d070f.firebaseapp.com",
      projectId: "math-tracker-d070f",
      storageBucket: "math-tracker-d070f.firebasestorage.app",
      messagingSenderId: "1040140743983",
      appId: "1:1040140743983:web:e4e1ca6b1e6f6c6d269dda"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const docRef = db.collection('dashboard').doc('state');

    const TEACHER_PASS = "121488";
    let isTeacher = false;
    let currentSection = null;
    let currentTerm = 1;
    let activeEditingStudentId = null;
    let activeEditingSectionId = null;

    let state = {
      banner: "https://images.unsplash.com/photo-1513542789411-b6a5d4f31634?w=1200&auto=format&fit=crop&q=60",
      sections: [],
      students: [],
      activities: [],
      completions: {}
    };

    docRef.onSnapshot((doc) => {
      if (doc.exists) {
        state = doc.data();
        render();
      } else {
        saveState();
      }
    });

    function saveState() {
      docRef.set(state);
    }

    function toggleMode() {
      if (!isTeacher) {
        const pass = prompt("Enter Teacher Passcode:");
        if (pass === TEACHER_PASS) {
          isTeacher = true;
          document.body.classList.add('teacher-mode');
          document.getElementById('mode-indicator').className = "mode-badge mode-teacher";
          document.getElementById('mode-indicator').innerText = "✏️ Teacher Mode";
          document.getElementById('toggle-mode-btn').innerText = "🔒 Exit Teacher Mode";
        } else if (pass !== null) {
          alert("Incorrect Passcode!");
        }
      } else {
        isTeacher = false;
        document.body.classList.remove('teacher-mode');
        document.getElementById('mode-indicator').className = "mode-badge mode-student";
        document.getElementById('mode-indicator').innerText = "👀 Student View";
        document.getElementById('toggle-mode-btn').innerText = "🔑 Teacher Login";
      }
      render();
    }

    function switchTerm(termNumber) {
      currentTerm = termNumber;
      [1, 2, 3].forEach(t => {
        const btn = document.getElementById(`term-${t}-btn`);
        if (t === termNumber) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
      renderSectionTable();
    }

    function updateLabel(input, labelId) {
      if (input.files && input.files[0]) {
        document.getElementById(labelId).innerText = "📷 " + input.files[0].name;
      }
    }

    function renderHome() {
      if (state.banner) {
        document.getElementById('main-banner').style.backgroundImage = `url('${state.banner}')`;
      }

      const grid = document.getElementById('sections-grid');
      grid.innerHTML = '';

      (state.sections || []).forEach(sec => {
        const studentCount = (state.students || []).filter(s => s.sectionId === sec.id).length;
        const defaultCover = "https://images.unsplash.com/photo-1509062522246-3755977927d7?w=600&auto=format&fit=crop&q=60";
        
        const card = document.createElement('div');
        card.className = 'section-card';
        card.innerHTML = `
          <div class="card-cover" style="background-image: url('${sec.cover || defaultCover}');">
            <div class="card-actions">
              <button class="action-badge-btn" onclick="renameSection(event, '${sec.id}')">✏️ Rename</button>
              <button class="action-badge-btn" onclick="triggerCoverChange(event, '${sec.id}')">📷 Cover</button>
              <button class="action-badge-btn" style="background:var(--danger);" onclick="deleteSection(event, '${sec.id}')">🗑️</button>
            </div>
          </div>
          <div class="card-body">
            <div class="card-title">${escapeHtml(sec.name)}</div>
            <div class="card-meta">👥 ${studentCount} Students Enrolled</div>
          </div>
        `;
        card.onclick = (e) => {
          if (e.target.tagName !== 'BUTTON') openSection(sec.id);
        };
        grid.appendChild(card);
      });
    }

    function openSection(secId) {
      currentSection = (state.sections || []).find(s => s.id === secId);
      document.getElementById('home-view').style.display = 'none';
      document.getElementById('section-view').style.display = 'block';
      document.getElementById('breadcrumb').style.display = 'flex';
      document.getElementById('form-section-controls').style.display = 'grid';
      document.getElementById('active-section-title').innerText = currentSection ? currentSection.name : '';
      switchTerm(1);
    }

    function showHome() {
      currentSection = null;
      document.getElementById('home-view').style.display = 'block';
      document.getElementById('section-view').style.display = 'none';
      document.getElementById('breadcrumb').style.display = 'none';
      document.getElementById('form-section-controls').style.display = 'none';
      renderHome();
    }

    function renderSectionTable() {
      if (!currentSection) return;

      const headerRow = document.getElementById('table-header');
      const tbody = document.getElementById('table-body');

      const students = (state.students || []).filter(s => s.sectionId === currentSection.id);
      
      const activities = (state.activities || []).filter(a => 
        a.sectionId === currentSection.id && (a.term === currentTerm || (!a.term && currentTerm === 1))
      );

      headerRow.innerHTML = `<th>Student</th>`;
      activities.forEach((act, idx) => {
        const dateBadge = act.date ? `<div style="font-size:0.65rem; color:var(--primary); font-weight:600;">📅 ${act.date}</div>` : '';

        const teacherControls = isTeacher 
          ? `<div style="margin-top:2px;">
              <button class="icon-btn-sm" onclick="editActivity('${act.id}')">✏️</button>
              <button class="icon-btn-sm" style="color:var(--danger);" onclick="deleteActivity('${act.id}')">🗑️</button>
             </div>` 
          : '';

        const hasLink = !!act.link;
        const linkAttr = hasLink ? `href="${act.link}" target="_blank"` : '';

        headerRow.innerHTML += `
          <th>
            <a ${linkAttr} class="act-header-wrapper ${hasLink ? 'has-link' : ''}">
              <div style="font-weight:bold; font-size:0.75rem;">Act #${idx + 1} ${hasLink ? '🔗' : ''}</div>
              <div class="act-title-text" title="${escapeHtml(act.title)}">${escapeHtml(act.title)}</div>
              ${dateBadge}
            </a>
            ${teacherControls}
          </th>
        `;
      });

      tbody.innerHTML = '';
      students.forEach(student => {
        const tr = document.createElement('tr');
        
        const deleteStudentBtn = isTeacher 
          ? `<button class="icon-btn-sm" style="color:var(--danger);" onclick="deleteStudent(${student.id})">🗑️</button>` 
          : '';

        let studentCell = `
          <td>
            <div class="student-info">
              <img src="${student.avatar}" class="avatar" onclick="triggerAvatarChange(${student.id})" />
              <div style="flex:1; min-width: 0;">
                <strong class="student-name" onclick="editStudentName(${student.id})">${escapeHtml(student.name)}</strong>
              </div>
              ${deleteStudentBtn}
            </div>
          </td>
        `;

        let taskCells = activities.map(act => {
          const key = `${student.id}_${act.id}`;
          const isDone = !!(state.completions || {})[key];

          return `
            <td>
              <button 
                class="token-btn ${isDone ? '' : 'empty'}" 
                onclick="toggleToken(${student.id}, '${act.id}')"
                ${!isTeacher ? 'disabled' : ''}
              >
                ${act.token}
              </button>
            </td>
          `;
        }).join('');

        tr.innerHTML = studentCell + taskCells;
        tbody.appendChild(tr);
      });
    }

    function editStudentName(studentId) {
      if (!isTeacher) return;
      const student = state.students.find(s => s.id === studentId);
      if (student) {
        const newName = prompt("Edit Student Name:", student.name);
        if (newName && newName.trim() !== "") {
          student.name = newName.trim();
          saveState();
        }
      }
    }

    function editActivity(actId) {
      if (!isTeacher) return;
      const act = state.activities.find(a => a.id === actId);
      if (!act) return;

      const newTitle = prompt("Edit Activity Title:", act.title);
      if (newTitle === null) return;

      const newDate = prompt("Edit Date (YYYY-MM-DD):", act.date || "");
      if (newDate === null) return;

      const newLink = prompt("Edit URL Link:", act.link || "");
      if (newLink === null) return;

      const newToken = prompt("Edit Token Icon:", act.token || "⭐");

      act.title = newTitle.trim() || act.title;
      act.date = newDate.trim();
      act.link = newLink.trim();
      act.token = newToken.trim() || act.token;

      saveState();
    }

    function renameSection(event, secId) {
      event.stopPropagation();
      const sec = state.sections.find(s => s.id === secId);
      if (sec) {
        const newName = prompt("Rename Section:", sec.name);
        if (newName && newName.trim() !== "") {
          sec.name = newName.trim();
          saveState();
        }
      }
    }

    function toggleToken(studentId, actId) {
      if (!isTeacher) return;
      if (!state.completions) state.completions = {};
      const key = `${studentId}_${actId}`;
      state.completions[key] = !state.completions[key];
      saveState();
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    async function handleBannerFileSelect(event) {
      const file = event.target.files[0];
      if (file) {
        state.banner = await fileToBase64(file);
        saveState();
      }
      event.target.value = '';
    }

    async function addSection() {
      const name = document.getElementById('new-section-name').value.trim();
      const fileInput = document.getElementById('new-section-cover-file');
      if (!name) return alert("Enter section name");

      let cover = "";
      if (fileInput.files && fileInput.files[0]) {
        cover = await fileToBase64(fileInput.files[0]);
      }

      if (!state.sections) state.sections = [];
      state.sections.push({ id: 'sec_' + Date.now(), name, cover });
      document.getElementById('new-section-name').value = '';
      fileInput.value = '';
      document.getElementById('section-cover-label').innerText = "📷 Upload Cover";
      saveState();
    }

    function deleteSection(event, secId) {
      event.stopPropagation();
      if (confirm("Delete section and students?")) {
        state.sections = state.sections.filter(s => s.id !== secId);
        state.students = state.students.filter(s => s.sectionId !== secId);
        saveState();
      }
    }

    function deleteStudent(studentId) {
      if (confirm("Remove student?")) {
        state.students = state.students.filter(s => s.id !== studentId);
        saveState();
      }
    }

    function deleteActivity(actId) {
      if (confirm("Delete activity?")) {
        state.activities = state.activities.filter(a => a.id !== actId);
        saveState();
      }
    }

    function triggerCoverChange(event, secId) {
      event.stopPropagation();
      activeEditingSectionId = secId;
      document.getElementById('global-cover-picker').click();
    }

    async function handleCoverFileSelect(event) {
      const file = event.target.files[0];
      if (file && activeEditingSectionId) {
        const base64 = await fileToBase64(file);
        const sec = state.sections.find(s => s.id === activeEditingSectionId);
        if (sec) {
          sec.cover = base64;
          saveState();
        }
      }
      event.target.value = '';
    }

    function triggerAvatarChange(studentId) {
      if (!isTeacher) return;
      activeEditingStudentId = studentId;
      document.getElementById('global-avatar-picker').click();
    }

    async function handleAvatarFileSelect(event) {
      const file = event.target.files[0];
      if (file && activeEditingStudentId) {
        const base64 = await fileToBase64(file);
        const student = state.students.find(s => s.id === activeEditingStudentId);
        if (student) {
          student.avatar = base64;
          saveState();
        }
      }
      event.target.value = '';
    }

    async function addStudent() {
      const name = document.getElementById('new-student-name').value.trim();
      const fileInput = document.getElementById('new-student-avatar-file');
      if (!name || !currentSection) return alert("Enter student name");

      let avatar = `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(name)}`;
      if (fileInput.files && fileInput.files[0]) {
        avatar = await fileToBase64(fileInput.files[0]);
      }

      if (!state.students) state.students = [];
      state.students.push({
        id: Date.now(),
        name,
        sectionId: currentSection.id,
        avatar
      });

      document.getElementById('new-student-name').value = '';
      fileInput.value = '';
      document.getElementById('student-avatar-label').innerText = "👤 Upload Photo";
      saveState();
    }

    function assignActivity() {
      const title = document.getElementById('new-act-title').value.trim();
      const date = document.getElementById('new-act-date').value;
      const link = document.getElementById('new-act-link').value.trim();
      const token = document.getElementById('new-act-token').value;

      if (!title || !currentSection) return alert("Enter task title");

      if (!state.activities) state.activities = [];
      state.activities.push({
        id: 'act_' + Date.now(),
        title, date, link, token,
        sectionId: currentSection.id,
        term: currentTerm
      });

      document.getElementById('new-act-title').value = '';
      document.getElementById('new-act-date').value = '';
      document.getElementById('new-act-link').value = '';
      saveState();
    }

    function escapeHtml(text) {
      return (text || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function render() {
      if (currentSection) {
        renderSectionTable();
      } else {
        renderHome();
      }
    }
  </script>
</body>
</html>
